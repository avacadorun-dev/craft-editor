[package]
name = "craft-editor-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
native-clipboard = ["dep:clipboard-rs"]
wayland-clipboard = ["native-clipboard", "clipboard-rs/wayland"]
wordcraft-geometry = ["dep:wordcraft-doc", "dep:wordcraft-layout", "dep:wordcraft-geom", "dep:wordcraft-fonts", "dep:skrifa"]
wordcraft-canvas = ["wordcraft-geometry", "dep:wordcraft-render"]

[dependencies]
egui.workspace = true
craft-editor-model.workspace = true
serde_json.workspace = true
thiserror.workspace = true
scraper = { version = "=0.29.0", default-features = false }
ego-tree = "=0.11.0"
clipboard-rs = { version = "=0.3.5", default-features = false, optional = true }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-onig", "yaml-load"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }
wordcraft-doc = { git = "https://github.com/storytold/wordcraft", rev = "da914ce674f18ebc4e08cca425cc8f8acca3372f", optional = true }
wordcraft-layout = { git = "https://github.com/storytold/wordcraft", rev = "da914ce674f18ebc4e08cca425cc8f8acca3372f", optional = true }
wordcraft-geom = { git = "https://github.com/storytold/wordcraft", rev = "da914ce674f18ebc4e08cca425cc8f8acca3372f", optional = true }
wordcraft-render = { git = "https://github.com/storytold/wordcraft", rev = "da914ce674f18ebc4e08cca425cc8f8acca3372f", optional = true }
wordcraft-fonts = { git = "https://github.com/storytold/wordcraft", rev = "da914ce674f18ebc4e08cca425cc8f8acca3372f", optional = true }
skrifa = { version = "=0.47.0", optional = true }

[lints]
workspace = true

[[example]]
name = "wordcraft_geometry"
required-features = ["wordcraft-geometry"]

[[example]]
name = "wordcraft_canvas"
required-features = ["wordcraft-canvas"]

[[example]]
name = "native_syntax"
required-features = ["wordcraft-canvas"]

[[example]]
name = "native_clipboard"
required-features = ["native-clipboard"]
