[workspace]
resolver = "3"
members = ["crates/craft-editor-model", "crates/craft-editor-egui", "crates/craft-editor-render"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/avacadorun-dev/craft-editor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
egui = "=0.36.2"
prosemirror = "=0.5.2"
craft-editor-model = { path = "crates/craft-editor-model" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"

[profile.dev]
debug = 0
incremental = false
strip = "none"
